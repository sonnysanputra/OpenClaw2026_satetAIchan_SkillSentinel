[project]
name = "skillsentinel"
description = "Multi-agent security system for vetting AI agent skills."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "The SkillSentinel Authors" },
]
keywords = ["security", "ai-agents", "skills", "static-analysis", "sandbox"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# Version is derived dynamically from scripts/build_info.py
dynamic = ["version"]

dependencies = [
    "pydantic>=2.7",
    "anthropic>=0.40",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "tomli>=2.0; python_version<'3.11'",
    "cryptography>=42",                  # Ed25519 signing
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]
gateway = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.30",
]
static = [
    # Static-analysis tools are invoked as subprocesses; binaries installed separately.
]
sandbox = [
    # gVisor / Firecracker provisioned outside Python.
]

[project.scripts]
skillsentinel = "skillsentinel.cli.main:app"

[project.urls]
Homepage = "https://github.com/your-org/skillsentinel"
Documentation = "https://github.com/your-org/skillsentinel/tree/main/docs"
Repository = "https://github.com/your-org/skillsentinel"

# ----------------------------------------------------------------------------
# Build system
# ----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/skillsentinel/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/skillsentinel"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "S101",  # asserts are fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_any_generics = true
warn_return_any = true
warn_unused_ignores = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=skillsentinel",
    "--cov-report=term-missing",
]

[tool.coverage.run]
branch = true
source = ["src/skillsentinel"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
